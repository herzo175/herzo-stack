name: Skill evals

on:
  push:
    branches: [main]
    paths: ['skills/**', 'evals/**', '.github/workflows/evals.yml']
  pull_request:
    paths: ['skills/**', 'evals/**', '.github/workflows/evals.yml']
  workflow_dispatch:
    inputs:
      harness:
        description: Coding agent harness
        type: choice
        options: [pi, opencode, codex, claude]
        default: pi
      model:
        description: OpenRouter agent model (identical for both arms)
        required: true
        type: choice
        options:
          - deepseek/deepseek-v4.1-flash
          - z-ai/glm-5.3
          - qwen/qwen3.8-27b
          - openai/gpt-6.1-terra
          - anthropic/claude-opus-5.5
        default: deepseek/deepseek-v4.1-flash
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

concurrency:
  group: skill-evals-${{ github.event_name }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: true

env:
  EVAL_RUNTIME: ${{ inputs.harness || 'pi' }}
  EVAL_MODEL: ${{ inputs.model || 'deepseek/deepseek-v4.1-flash' }}
  EVAL_JUDGE_MODEL: ${{ vars.EVAL_JUDGE_MODEL || 'openai/gpt-5-mini' }}

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.9'
          python-version: '3.11'
      - run: uv sync --project evals --frozen
      - run: uv run --project evals --frozen ruff check evals
      - run: uv run --project evals --frozen ruff format --check evals
      - run: uv run --project evals --frozen pytest evals/tests -q
      - run: uv run --project evals --frozen herzo-evals --list --include-held-out
      - name: Build pinned coding runtimes
        run: docker build --tag herzo-evals:local evals/container
      - name: Verify native skill discovery without model calls
        run: >-
          docker run --rm --read-only
          --tmpfs /tmp:mode=1777
          --tmpfs /home/node:uid=1000,gid=1000
          --tmpfs /skills:mode=1777
          --entrypoint python3 herzo-evals:local /opt/herzo-evals/smoke.py

  plan:
    needs: offline
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && vars.EVAL_SCHEDULE_ENABLED == 'true') ||
      (github.event_name == 'pull_request' && vars.EVAL_PR_RUNS_ENABLED == 'true' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.9'
          python-version: '3.11'
      - name: Select disjoint bounded shards
        id: plan
        run: |
          matrix="$(uv run --project evals --frozen herzo-evals --matrix \
            --runtime "$EVAL_RUNTIME" --model "$EVAL_MODEL" \
            --kind checkpoint --kind episode --include-held-out --repeat 1)"
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  behavioral:
    needs: [offline, plan]
    if: needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.9.9'
          python-version: '3.11'
      - run: uv sync --project evals --frozen
      - run: docker build --tag herzo-evals:local evals/container
      - name: Run eval trials
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          SHARD_INDEX: ${{ matrix.index }}
          SHARD_TOTAL: ${{ matrix.total }}
        run: |
          uv run --project evals --frozen herzo-evals \
            --runtime "$EVAL_RUNTIME" --kind checkpoint --kind episode --include-held-out \
            --model "$EVAL_MODEL" --judge-model "$EVAL_JUDGE_MODEL" \
            --no-skill-baseline --repeat 1 --concurrency 1 --timeout 600 \
            --shard "$SHARD_INDEX/$SHARD_TOTAL" --output evals/results/ci
      - name: Publish review summary
        if: always()
        run: uv run --project evals --frozen python evals/tools/summarize.py evals/results/ci
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: skill-eval-evidence-${{ github.run_id }}-${{ matrix.index }}
          path: evals/results/ci
          if-no-files-found: ignore
          retention-days: 7
